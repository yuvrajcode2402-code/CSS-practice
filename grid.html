<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid</title>
    <style>
        .container{
            display:grid;
            background-color: pink;
            height: 56vh;
            /* row-gap:9px; */ /*{gap between rows in a grid}*/

            /* column-gap: 9px; */ /*{gap between columns in a grid}*/

            gap: 9px 9px;/*{gap between rows and columns together in a grid}*/

            grid-template-columns: auto auto auto auto;
            /*change the width of columns*/

            grid-template-rows: auto auto auto;
            /*change the height of columns*/

            /* justify-content:center; */
            /*changes in horizontal axis*/

            /* align-content:center;  */
            /* changes in vertical axis */

           


        }
        .item{
            background-color: aqua;
            border: 2px solid olive;
            
        }
        #item-1{
            grid-column: 1/3;
            grid-row: 1/4;
        }
    </style>
</head>
<body>
    <div class="container">
       <div class="item" id="item-1">1</div>
       <div class="item">2</div>
       <div class="item">3</div>
       <div class="item">4</div>
       <div class="item">5</div>
       <div class="item">6</div>
       <div class="item">7</div>
       <div class="item">8</div>
       <div class="item">9</div>

    </div>
</body>
</html>
